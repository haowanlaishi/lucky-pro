<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover,height=device-height,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>千万梦想基金</title>
<style>
:root{
  --p:#e63946;--s:#1d3557;--red:linear-gradient(135deg,#ff4b4b,#d90429);--blue:linear-gradient(135deg,#4cc9f0,#0077b6);--orange:linear-gradient(135deg,#f9c74f,#f8961e);--qf:linear-gradient(135deg,#5c5c99,#2d2d6b);--qb:linear-gradient(135deg,#f2c46d,#d4a037);--g:#e0e0e0;--gold:#d4a037;
  /* 语义变量（浅色） */
  --bg-page:#f4f6f9;--bg-card:#fff;--bg-input:#f8f9fa;
  --text-main:#333;--text-sub:#888;--text-light:#aaa;
  --border:#e0e0e0;--shadow:rgba(0,0,0,0.06); /* 稍微加深一点点阴影 */
  --glass-page:rgba(255,255,255,0.72); /* 吸顶区：从灰底改成微白底，降低透明度让颜色透出来 */
  --glass-bg:rgba(255,255,255,0.75); 
  --glass-btn:rgba(255,255,255,0.65); /* 按钮稍微透一点，显现出下面的底色 */
  --glass-btn-strong:rgba(255,255,255,0.55); 
}
@media (prefers-color-scheme: dark){
  :root{
    --bg-page:#1c1c1e;--bg-card:#2c2c2e;--bg-input:#3a3a3c;
    --text-main:#f2f2f7;--text-sub:#98989d;--text-light:#636366;
    --border:#38383a;--shadow:rgba(0,0,0,0.4);
    --glass-page:rgba(28,28,30,0.78);--glass-bg:rgba(44,44,46,0.8);--glass-btn:rgba(44,44,46,0.72);--glass-btn-strong:rgba(44,44,46,0.6);
  }
  
  /* 1. 选号球和选中区 */
  .nb { background: var(--bg-input) !important; border-color: #48484a !important; color: var(--text-sub); }
  .nb.qf { color: #c0c0ff !important; border-color: #5c5c99 !important; }
  /* 👈 修复深色下选中后不发色的问题 */
  .nb.sel.red { background: var(--red) !important; color: #fff !important; border: none !important; }
  .nb.sel.blue { background: var(--blue) !important; color: #fff !important; border: none !important; }
  .nb.sel.orange { background: var(--orange) !important; color: #fff !important; border: none !important; }
  
  .ps.as { background: rgba(255,255,255,0.06) !important; border-color: rgba(255,255,255,0.15) !important; }
  
  /* 2. 边框弱化 */
  .top-sticky-wrapper{border-bottom-color:transparent !important;}
  .hp{border-color:rgba(255,255,255,0.08);}
  .tabs{border-color:rgba(255,255,255,0.1);}
  .btn.br{border-color:rgba(255,255,255,0.1);}
  .header h1 { color: var(--text-sub); }

  /* 3. 彻底干掉深蓝：Tab 和记录选中态改为深灰底 + 纯白字 */
  .tab.active { 
    background: #38383a !important; 
    color: #ffffff !important; 
    border-color: transparent !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); 
  }
  .hb.active { 
    background: #38383a !important; 
    color: #ffffff !important; 
    border-color: rgba(255,255,255,0.1) !important; 
  }

  /* 4. 长按菜单的“复制” */
    /* 👈 修复长按菜单的字色，确保在深色背景下清晰可见 */
  .ctx-menu-item.copy { color: #f2f2f7 !important; }  /* 复制：改为纯白，最清晰 */
  .ctx-menu-item.fill { color: #ff6b6b !important; }  /* 回填：改为亮红，醒目 */
  .ctx-menu-item:last-child { color: #98989d !important; } /* 取消：次级灰，拉开层次 */ 
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html, body { height: 100%; height: 100dvh; overflow: hidden; background: var(--bg-page); position: relative; font-family: -apple-system, sans-serif; color: var(--text-main); }
.app-scroll { height: 100%; height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; padding: 0 15px calc(60px + env(safe-area-inset-bottom)) 15px; box-sizing: border-box; background: var(--bg-page); -webkit-transform: translate3d(0,0,0); transform: translate3d(0,0,0); will-change: transform; }
.top-sticky-wrapper{ position:-webkit-sticky; position:sticky; top:0; z-index:1000; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; background:var(--glass-page); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding-top:calc(15px + env(safe-area-inset-top)); padding-bottom:5px; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.8); flex-shrink:0; }
.header{text-align:center;margin-bottom:10px;width:100%}
.header h1{color:var(--text-main);font-size:22px}
.tabs{display:flex;background:var(--glass-btn-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:12px;padding:5px;box-shadow:0 2px 10px var(--shadow);width:100%;margin-bottom:5px;border:1px solid rgba(255,255,255,0.5)}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:bold;color:var(--text-sub);border-radius:8px;cursor:pointer;transition:all .3s}
.tab.active{background:var(--s);color:#fff;box-shadow:0 2px 8px rgba(29,53,87,0.3);border:1px solid transparent;}
.ab{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;width:100%;padding:5px 0;margin-bottom:5px}
.ms{display:flex;gap:6px;align-items:center}
.mb{background:var(--glass-btn);border:1px solid var(--border);padding:5px 14px;border-radius:20px;font-size:13px;color:var(--text-sub);cursor:pointer;font-weight:bold;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mb.active{border-color:var(--p);color:var(--p);background:rgba(255,240,240,0.9)}
.dv{width:1px;height:20px;background:rgba(0,0,0,0.1);margin:0 6px}
.hb{background:var(--glass-btn);color:var(--text-main);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;margin-left:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .15s,color .15s,border-color .15s}
.hb.active{background:var(--s);color:#fff;border-color:transparent}
.badge{background:var(--p);color:#fff;font-size:11px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:99px;}
.ap{display:none;align-items:center;gap:5px;background:transparent;border:none;padding:4px 4px;font-size:13px;font-weight:bold;color:#999;cursor:pointer;transition:all .2s;flex-shrink:0}
.ap.show{display:inline-flex}
.ap .c{width:16px;height:16px;border-radius:50%;border:2px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:transparent;flex-shrink:0;transition:all .2s}
.ap.ck{color:var(--gold)}
.ap.ck .c{border-color:var(--gold);color:var(--gold)}
.hp{display:none;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);width:100%;max-width:400px;border-radius:16px;padding:12px;box-shadow:0 8px 32px var(--shadow);margin-bottom:15px;border:1px solid rgba(255,255,255,0.6);flex-direction:column;gap:12px;transition:height .3s}
.hp.show{display:flex;animation:sd .3s}
@keyframes sd{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.hp.closing{animation:hp-close .12s ease forwards}
@keyframes hp-close{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}
.hh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px;flex-shrink:0;position:relative;gap:8px}
.ht{font-size:14px;font-weight:bold;color:var(--text-main)}
.ta{color:#d4a037;font-size:12px;font-weight:bold;background:#fffaf0;padding:2px 10px;border-radius:12px;border:1px solid #f6e0b5;white-space:nowrap;margin-left:auto}
.ta span{font-size:13px;font-weight:900}
.cp{display:none;align-items:center;background:transparent;border:none;padding:2px 4px;font-size:13px;font-weight:bold;color:var(--gold);cursor:pointer;transition:all .2s;flex-shrink:0;white-space:nowrap}
.cp.show{display:inline-flex}
.cp:active{transform:scale(.92)}
.cb{font-size:13px;color:var(--text-light);background:none;border:none;cursor:pointer}
.hl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sc{position:relative;border-radius:8px;overflow:hidden;background:var(--bg-card);flex-shrink:0}
.sa{position:absolute;top:0;bottom:0;width:70px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;z-index:1;color:#fff;}
.sa-right{right:0;background:#ff4d4f;}
.sa-left{left:0;background:#52c41a;}
.hi{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;padding:10px 6px;background:var(--bg-card);position:relative;align-items:center;transition:transform .3s cubic-bezier(.25,.8,.25,1);z-index:2;width:100%;touch-action:pan-y;flex-direction:column}
.hi.swiped-left{transform:translateX(-70px)}
.hi.swiped-right{transform:translateX(70px)}
.hi .ball{width:38px;height:38px;font-size:17px;flex-shrink:0}
.rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}
.vl{width:2px;height:24px;background:linear-gradient(to bottom,transparent,#ccc,transparent);margin:0 4px;border-radius:1px}
.hi.ml{padding:12px 8px;display:block}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 2px;width:100%;align-items:center}
.mg .ball.front{justify-self:start}
.mg .ball.back{justify-self:end}
.panel{background:var(--bg-card);width:100%;max-width:400px;border-radius:16px;padding:15px;box-shadow:0 4px 12px var(--shadow);display:flex;flex-direction:column;margin-bottom:20px}
.panel.hidden{display:none}
.rd{font-size:12px;color:var(--text-sub);margin-bottom:15px;text-align:center}
.ra{min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;padding:10px 12px;background:var(--bg-input);border-radius:10px;margin-bottom:15px;gap:8px;width:100%;overflow:hidden;border:none}
.bw{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.bw.multi-layout{flex-direction:row;align-items:flex-start;justify-content:flex-start}
.bw.multi-layout .fw,.bw.multi-layout .bw2{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;width:100%}
.bw.multi-layout .bw2{justify-content:flex-end;margin-top:6px}
.ball{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px;box-shadow:0 2px 5px rgba(0,0,0,.15);flex-shrink:0}
.ball.red{background:var(--red)}
.ball.blue{background:var(--blue)}
.ball.orange{background:var(--orange)}
.ball.qf{background:var(--qf)}
.ball.qb{background:var(--qb)}
.ball-lock{position:absolute;top:-2px;right:-2px;font-size:11px;color:#ffd700;text-shadow:0 0 2px #000;pointer-events:none;z-index:2;}
.qp{display:flex;gap:6px;justify-content:center;margin-bottom:15px;flex-wrap:wrap;align-items:center;min-height:64px;padding:10px 12px;background:var(--bg-input);border-radius:10px;border:none}
.qg{display:flex;gap:6px;align-items:center}
.qd{width:1px;height:20px;background:var(--border);margin:0 4px}
.pb{position:relative;width:34px;height:34px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--text-light);cursor:pointer;transition:all .2s;font-size:16px}
.pb.active{border-color:var(--p);border-style:solid;background:#fff0f0;color:var(--p);transform:scale(1.1)}
.pb.fqf{background:var(--qf);border:none;color:#fff}
.pb.fqb{background:var(--qb);border:none;color:#fff}
.pb-lock{position:absolute;top:-2px;right:-2px;font-size:11px;color:#ffd700;text-shadow:0 0 2px #000;pointer-events:none;z-index:2;}
.pa{margin-bottom:15px}
.ps{margin-bottom:15px;padding:10px;border-radius:12px;border:1px solid transparent;transition:all .3s}
.ps.as{background:rgba(253,251,247,0.8);border-color:#f9c74f}
.pt{font-size:13px;color:var(--text-sub);margin-bottom:8px;font-weight:bold;text-align:center}
.ng{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nb{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.8);border:1px solid var(--border);font-size:14px;color:var(--text-main);cursor:pointer;transition:all .1s}
.nb:active{transform:scale(.9)}
.nb.sel.red{background:var(--red);color:#fff;border:none;box-shadow:none}
.nb.sel.blue{background:var(--blue);color:#fff;border:none;box-shadow:none}
.nb.sel.orange{background:var(--orange);color:#fff;border:none;box-shadow:none}
.nb.qf{border-color:#c0c0d9;color:#2d2d6b}
.nb.qb{border-color:#e6d3a3;color:#b07d1a}
.nb-lock{position:absolute;top:-2px;right:-2px;font-size:10px;color:#ffd700;text-shadow:0 0 2px #000;pointer-events:none;z-index:2;}
.ng.qbg{grid-template-columns:repeat(5,1fr)}
.btns{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:12px;width:90%;max-width:380px;z-index:999;transition:transform 0.3s cubic-bezier(0.25,0.8,0.25,1);}
.btns.hide-bar{transform:translate(-50%,400%) !important;}
.btn{flex:1;border:none;border-radius:30px;padding:15px 0;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn.br{background:var(--glass-btn-strong);color:var(--text-main);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 20px var(--shadow);border:1px solid rgba(255,255,255,0.4);}
.btn.bs{background:linear-gradient(135deg,#f4a261,#e76f51);color:#fff;box-shadow:0 6px 15px rgba(231,111,81,0.4);}
.btn:active{transform:scale(0.95);}
.et{text-align:center;color:var(--text-light);font-size:13px;padding:15px 0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
@keyframes jelly-pop { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 70% { transform: scale(0.95); } 100% { transform: scale(1); } }
.nb.pop-anim { animation: jelly-pop 0.3s ease-in-out !important; }
.btn.br.pressing { transform: scale(0.95); background: rgba(245,230,200,0.9); border-color: #f9c74f; }
.btn.br.flash { animation: btnFlash 0.3s ease-out; }
.btn.bs.pressing { transform: scale(0.95); opacity: 0.85; }
.btn.bs.flash { animation: btnFlashOrange 0.4s ease-out; }
@keyframes btnFlashOrange { 0% { box-shadow: 0 0 0 0 rgba(231,111,81,0.8); } 100% { box-shadow: 0 0 0 25px rgba(231,111,81,0); } }
@keyframes btnFlash { 0% { box-shadow: 0 0 0 0 rgba(249,199,79,0.7); } 100% { box-shadow: 0 0 0 20px rgba(249,199,79,0); } }
/* 👈 仅保留预览区(.ball)和七星彩(.pb)为金色，选号区(.nb)保持原本的红/蓝/橙色 */
.ball.lucky, .pb.lucky { 
  background: #d4a037 !important; 
  color: #fff !important; 
  border: none !important; 
}
.ctx-menu-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.1); z-index: 2000; display: none; opacity: 0; transition: opacity 0.2s; pointer-events: none; touch-action: none; }
.ctx-menu-overlay.show { display: block; opacity: 1; pointer-events: auto; }
.ctx-menu { position: fixed; background: var(--bg-card); border-radius: 12px; box-shadow: 0 10px 30px var(--shadow); display: none; flex-direction: column; overflow: hidden; width: 120px; z-index: 2001; pointer-events: auto; opacity: 0; transform: scale(0.96); transition: opacity 0.15s, transform 0.15s; }
.ctx-menu.show { display: flex; opacity: 1; transform: scale(1); }
.ctx-menu-item { padding: 12px 15px; font-size: 14px; color: var(--text-main); font-weight: bold; text-align: center; cursor: pointer; border-bottom: 1px solid var(--border); }
.ctx-menu-item:last-child { border-bottom: none; color: var(--text-light); }
.ctx-menu-item:active { background: rgba(0,0,0,0.03); }
.ctx-menu-item.copy { color: var(--s); }
.ctx-menu-item.fill { color: var(--p); }
.sc.pressing { transform: scale(0.95) translateY(-4px) !important; box-shadow: 0 12px 30px var(--shadow) !important; z-index: 10; transition: transform 0.3s cubic-bezier(0.25,0.8,0.25,1), box-shadow 0.3s ease !important; overflow: hidden; }
.hi, .nb, .hi *, .sc, .sc *, .hl, .hl *, .rw, .rw *, .ball, .ball *, .vl, .mg, .mg * { -webkit-touch-callout: none !important; -webkit-user-select: none !important; user-select: none !important; }
.btn, .mb, .hb, .tab, .nb, .pb, .ball, .hb { -webkit-touch-callout: none !important; -webkit-user-select: none !important; user-select: none !important; }
.btn, .mb, .hb, .tab, .nb, .pb, .ball, .hb {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important; 
  user-select: none !important;
}

/* 👇 在这里插入画廊的 CSS 👇 */
/* ================= 全屏图片画廊 ================= */
.gallery-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000; z-index: 9999;
  display: none; opacity: 0; transition: opacity 0.2s;
  touch-action: none; /* 防止原生滚动干扰 */
}
.gallery-overlay.show { display: block; }
.gallery-track {
  display: flex; width: 100%; height: 100%;
  overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none; /* 隐藏滚动条 */
}
.gallery-track::-webkit-scrollbar { display: none; }
.gallery-slide {
  flex: 0 0 100vw; height: 100vh;
  scroll-snap-align: center;
  display: flex; align-items: center; justify-content: center;
}
.gallery-slide img {
  width: 100%; height: 100%; object-fit: cover;
  pointer-events: none; /* 防止图片被长按拖拽 */
}

/* 👇 打开时轻微缩放回弹（系统相册质感） */
.gallery-overlay.show .gallery-track {
  animation: galZoomIn 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
}
@keyframes galZoomIn {
  from { transform: scale(1.04); opacity: 0.6; }
  to   { transform: scale(1);    opacity: 1; }
}
/* 👆 插入结束 👆 */

</style></head>
<body>
<div class="app-scroll">
  <div class="top-sticky-wrapper">
    <div class="header"><h1>🎉 千万梦想基金</h1></div>
    <div class="tabs"><div class="tab active" data-type="ssq">双色球</div><div class="tab" data-type="dlt">大乐透</div><div class="tab" data-type="qxc">七星彩</div></div>
    <div class="ab"><div class="ms"><button class="mb active" data-mode="single">单式</button><button class="mb" data-mode="multi">复式</button></div><button class="ap" id="ap"><span class="c">✓</span><span>追加</span></button><div class="dv"></div><button class="hb" id="hb">记录 <span class="badge" id="badge">0</span></button></div>
  </div>
  <div class="hp" id="hp"><div class="hh"><div class="ht" id="ht">选号记录</div><button class="cp" id="cp">复制</button><div class="ta" id="ta" style="display:none;">总计 <span id="tv">0</span> 元</div><button class="cb" id="cb">清空</button></div><div class="hl" id="hl"></div></div>
  <div class="panel" id="mp"><div class="rd" id="rd"></div><div class="ra" id="ra"></div><div class="qp" id="qp" style="display:none"></div><div class="pa" id="pa"></div></div>
</div>
<div class="btns" id="bottom-btns"><button class="btn br" id="rb">🎲 机选填满</button><button class="btn bs" id="cf">✅ 确认选号</button></div>
<div class="toast" id="toast">提示</div>
<div class="ctx-menu-overlay" id="ctx-overlay"></div>
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-menu-item copy" id="ctx-copy">复制</div>
  <div class="ctx-menu-item fill" id="ctx-fill">回填</div>
  <div class="ctx-menu-item cancel" id="ctx-cancel">取消</div>
</div>
<!-- 👇 在这里插入画廊的 HTML 👇 -->
<!-- 全屏画廊层 -->
<div class="gallery-overlay" id="gallery-overlay">
  <div class="gallery-track" id="gallery-track">
    <!-- 【首部副本】固定：等于最后一张真实图 images/99.webp -->
    <div class="gallery-slide"><img src="images/99.webp"></div>

    <!-- ========== 全部真实图片 1 ~ 50 ========== -->
    <div class="gallery-slide"><img src="images/1.webp"></div>

function getFibonacciLuckyNumbers(count, maxNum) {
  let timestamp = Date.now();
  const nums = [];
  const FIB_HASH = 2654435761;
  while (nums.length < count) {
    let hash = Math.imul(timestamp, FIB_HASH); hash = hash >>> 0;
    let num = (hash % maxNum) + 1;
    if (!nums.includes(num)) nums.push(num); else timestamp++;
  }
  return nums.sort((a, b) => a - b);
}
const LOT={

function toast(m){ te.innerText=m;te.style.opacity=1; setTimeout(()=>{te.style.opacity=0},2000); }
function comb(n,k){ if(k<0||k>n)return 0; let r=1; for(let i=1;i<=k;i++) r=r*(n-i+1)/i; return Math.round(r); }
function calcBets(){
  const cfg=LOT[state.type];
  if(state.type==='qxc'){
    if(state.sel['orange'].includes(null)||state.sel['blue'][0]===null)return 0;
    return 1;
  }
  if(state.mode==='single'){
    for(const g of cfg.groups) if(state.sel[g.id].length!==g.count) return 0;
    return 1;
  }
  const f=state.sel[cfg.groups[0].id].length,b=state.sel[cfg.groups[1].id].length;
  if(f<cfg.groups[0].count||b<cfg.groups[1].count)return 0;
  return comb(f,cfg.groups[0].count)*comb(b,cfg.groups[1].count);
}
function pad2(n){return n<10?'0'+n:''+n;}

  if(state.hasTriggerRandom && state.qxcLocked[6]){

  }

    if(act&&v!==null){ state.sel['blue'][0]=null; state.qxcLocked[6]=false; }

  pa.innerHTML='';
  const os=document.createElement('div'); os.className='ps'+(state.qxcActive.group==='orange'?' as':'');

  bs.appendChild(bg2); pa.appendChild(bs);

function handleSelect(g,num){
  state.isLucky = false;
  const cur=state.sel[g.id];
  const idx=cur.indexOf(num);
  if(idx>-1){
    cur.splice(idx,1);
    if(state.locked[g.id]){
      const lidx = state.locked[g.id].indexOf(num);
      if(lidx>-1) state.locked[g.id].splice(lidx,1);
    }
  }else{
    const limit=state.mode==='single'?g.count:g.maxMulti;
    if(cur.length>=limit){ toast('最多只能选择 '+limit+' 个号码'); return; }
    cur.push(num);
  }
  render();
  setTimeout(()=>{
    document.querySelectorAll('.ng').forEach(grid=>{
      const balls=grid.querySelectorAll('.nb');
      const prev=grid.previousElementSibling;
      const isRed = prev && (prev.innerText.includes('红球') || prev.innerText.includes('前区'));
      if(g.id==='red' && !isRed) return;
      if(g.id==='blue' && isRed) return;
      balls.forEach(el=>{
        if(el.innerText===(num<10?'0'+num:num.toString())){
          el.classList.remove('pop-anim'); void el.offsetWidth; el.classList.add('pop-anim');
        }
      });
    });
  },10);
}
function randomFill(){
state.isLucky = false;
const cfg=LOT[state.type];
  if(state.mode==='multi'){
    state.locked={}; state.hasTriggerRandom=false; state.qxcLocked=[false,false,false,false,false,false,false];
    if(state.type==='qxc'){
      state.sel['orange']=Array.from({length:6},()=>Math.floor(Math.random()*10));
      state.sel['blue']=[Math.floor(Math.random()*15)];
      state.qxcActive={group:'orange',pos:0};
    }else{
      cfg.groups.forEach(g=>{
        state.sel[g.id]=[]; const cnt=g.count; let pool=[];
        for(let i=g.min;i<=g.max;i++)pool.push(i);
        for(let i=0;i<cnt;i++){ const ri=Math.floor(Math.random()*pool.length); state.sel[g.id].push(pool[ri]); pool.splice(ri,1); }
      });
    }
    render(); return;
  }
  if(state.type==='qxc'){
    if(!state.hasTriggerRandom){
      for(let i=0;i<6;i++){ if(state.sel['orange'][i]!==null) state.qxcLocked[i]=true; }
      if(state.sel['blue'][0]!==null) state.qxcLocked[6]=true;
      state.hasTriggerRandom=true;
    }
    const allLock = state.qxcLocked.every(b=>b===true);
    if(allLock){ toast('所有号码已手动锁定，无需机选填充'); render(); return; }
    for(let i=0;i<6;i++){ if(!state.qxcLocked[i]){ state.sel['orange'][i]=Math.floor(Math.random()*10); } }
    if(!state.qxcLocked[6]){ state.sel['blue'][0]=Math.floor(Math.random()*15); }
    render(); return;
  }
  const g1 = cfg.groups[0]; const g2 = cfg.groups[1];
  if(!state.locked[g1.id]) state.locked[g1.id]=[];
  if(!state.locked[g2.id]) state.locked[g2.id]=[];
    if(!state.hasTriggerRandom){
    state.locked[g1.id] = [...state.sel[g1.id]];
    state.locked[g2.id] = [...state.sel[g2.id]];
    state.hasTriggerRandom=true;
  }
  const g1AllLock = state.locked[g1.id].length >= g1.count;
  const g2AllLock = state.locked[g2.id].length >= g2.count;
  if(g1AllLock && g2AllLock){ toast('所有号码已手动锁定，无需机选填充'); render(); return; }
  state.sel[g1.id] = [...state.locked[g1.id]];
  state.sel[g2.id] = [...state.locked[g2.id]];
  if(state.sel[g1.id].length < g1.count){
    let pool1=[];
    for(let i=g1.min;i<=g1.max;i++){ if(!state.locked[g1.id].includes(i)) pool1.push(i); }
    const need1 = g1.count - state.sel[g1.id].length;
    for(let i=0;i<need1;i++){ const ri = Math.floor(Math.random()*pool1.length); state.sel[g1.id].push(pool1[ri]); pool1.splice(ri,1); }
  }
  if(state.sel[g2.id].length < g2.count){
    let pool2=[];
    for(let i=g2.min;i<=g2.max;i++){ if(!state.locked[g2.id].includes(i)) pool2.push(i); }
    const need2 = g2.count - state.sel[g2.id].length;
    for(let i=0;i<need2;i++){ const ri = Math.floor(Math.random()*pool2.length); state.sel[g2.id].push(pool2[ri]); pool2.splice(ri,1); }
  }
  render();
}
function confirmSel(){
  const cfg=LOT[state.type];
  let ok=true;
  if(state.type==='qxc'){
    if(state.sel['orange'].includes(null)){toast('请填满前区6个位置');ok=false;}
    else if(state.sel['blue'][0]===null){toast('请选择后区号码');ok=false;}
  }else{
    for(const g of cfg.groups){
      if(state.sel[g.id].length<g.count){ toast(g.name+' 至少需要选择 '+g.count+' 个号码'); ok=false; break; }
    }
  }
  if(ok){
    const bets=calcBets(); const price=cfg.base*bets;
    const rec={
      id:Date.now() + Math.floor(Math.random()*1000), type:state.type, mode:state.mode,
      numbers:JSON.parse(JSON.stringify(state.sel)), betCount:bets, price:price, isAppend:false,
      isLucky: state.isLucky
    };
    state.list.push(rec);

function buildCopyText(){
  const isStar = state.view === 'star'; 
  const sourceList = isStar ? state.starList : state.list;
  const d = sourceList.filter(i=>i.type===state.type&&i.mode===state.mode);
  if(d.length===0) return null;

  const cfg = LOT[state.type]; 
  const head = '你好，' + cfg.name + (state.mode==='multi'?'复式':'');

  // 👈 单式多条同号合并（所有彩种通用）
  if (!isStar && state.mode === 'single' && d.length > 1) {
    const firstNumsStr = JSON.stringify(d[0].numbers);
    const allSame = d.every(item => JSON.stringify(item.numbers) === firstNumsStr);

    if (allSame) {
      let oneLine = '';
      if (state.type === 'qxc') {
        const front = d[0].numbers['orange'].map(n=>n.toString()).join('  ');
        const back = d[0].numbers['blue'].map(n=>n.toString()).join('  ');
        oneLine = front + '  +  ' + back;
      } else {
        const fg = cfg.groups[0], bg = cfg.groups[1];
        const front = [...d[0].numbers[fg.id]].sort((a,b)=>a-b).map(pad2).join('  ');
        const back = [...d[0].numbers[bg.id]].sort((a,b)=>a-b).map(pad2).join('  ');
        oneLine = front + '  +  ' + back;
      }
      // 👈 合并行：倍数 + 追加（仅大乐透追加时带 ·追加）
      const appendTag = (d[0].type === 'dlt' && d[0].isAppend) ? '·追加' : '';
      return head + '\n' + oneLine + ' [' + d.length + '倍' + appendTag + ']';
    }
  }

  // 👈 普通多行：每条一行，大乐透追加带 [追加]
  const lines = d.map(item => {
    let oneLine = '';
    if(item.type==='qxc'){
      const front=item.numbers['orange'].map(n=>n.toString()).join('  ');
      const back=item.numbers['blue'].map(n=>n.toString()).join('  ');
      oneLine = front+'  +  '+back;
    }else{
      const fg=cfg.groups[0],bg=cfg.groups[1];
      const front=[...item.numbers[fg.id]].sort((a,b)=>a-b).map(pad2).join('  ');
      const back=[...item.numbers[bg.id]].sort((a,b)=>a-b).map(pad2).join('  ');
      oneLine = front+'  +  '+back;
    }
    const appendTag = (item.type === 'dlt' && item.isAppend) ? ' [追加]' : '';
    return oneLine + appendTag;
  });
  
  return head+'\n'+lines.join('\n');
}

  document.body.removeChild(t); if(ok) done(); else toast('复制失败，请重试');
}

  else{ fallbackCopy(text,done); }
}

function bindSwipe(item){
  let sx=0, sy=0, sw=false, dir=null;
  let pressTimer = null;
  item._isLongPressed = false;

  item.addEventListener('touchstart',e=>{
    if (isMenuLocked) {
      setTimeout(() => { isMenuLocked = false; }, 50);
      return; 
    }
    const allowLongPress = (state.view !== 'star') && (state.mode === 'single');
    if (item.classList.contains('swiped-left') || item.classList.contains('swiped-right')) return;
    document.querySelectorAll('.hi.swiped-left,.hi.swiped-right').forEach(el=>{ if(el!==item){ el.classList.remove('swiped-left','swiped-right'); el.style.transform=''; } });
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; sw=false; dir=null; item._isLongPressed=false; item.style.transition='none';

    if (allowLongPress) {
      pressTimer = setTimeout(() => {
        item._isLongPressed = true;
        if (e.cancelable) e.preventDefault();
        playFeedback();
        item.parentElement.classList.add('pressing');
        const rect = item.getBoundingClientRect();
        const menu = document.getElementById('ctx-menu');
        const overlay = document.getElementById('ctx-overlay');
        const menuH = 132;
        const menuW = 120;
        const gap = 6;  
        const screenH = window.innerHeight;
        const screenW = window.innerWidth;
        const scaleOffset = rect.height * 0.025;
        const liftOffset = 4;
        const actualTop = rect.top + scaleOffset - liftOffset; 
        const actualBottom = rect.bottom - scaleOffset - liftOffset;
        const actualLeft = rect.left + (rect.width * 0.025);
        let top;
        if (actualTop > screenH / 2) {
          top = actualTop - menuH - gap;
        } else {
          top = actualBottom + gap;
        }
        if (top < 8) top = 8;
        if (top + menuH > screenH - 8) top = screenH - menuH - 8;
        let left = actualLeft;
        if (left + menuW > screenW - 8) left = screenW - menuW - 8;
        if (left < 8) left = 8;
        menu.style.top = top + 'px';
        menu.style.left = left + 'px';
        isMenuLocked = true;
        overlay.classList.add('show');
        menu.classList.add('show');
        const oldCopy = document.getElementById('ctx-copy');
        const oldFill = document.getElementById('ctx-fill');
        const oldCancel = document.getElementById('ctx-cancel');
        let newCopy = oldCopy;
        let newFill = oldFill;
        let newCancel = oldCancel;
        if (oldCopy && oldFill && oldCancel && oldCopy.parentNode && oldFill.parentNode && oldCancel.parentNode) {
          newCopy = oldCopy.cloneNode(true);
          newFill = oldFill.cloneNode(true);
          newCancel = oldCancel.cloneNode(true);
          oldCopy.parentNode.replaceChild(newCopy, oldCopy);
          oldFill.parentNode.replaceChild(newFill, oldFill);
          oldCancel.parentNode.replaceChild(newCancel, oldCancel);
        }
        newCopy.addEventListener('touchstart', (ev) => {
          isMenuLocked = false;
          ev.stopPropagation();
          ev.preventDefault();
          overlay.classList.remove('show');
          menu.classList.remove('show');
          item.parentElement.classList.remove('pressing');
          setTimeout(() => {
            if (item._itemData) {
              copyRecordBelow(item._itemData);
            } else {
              toast('获取数据失败');
            }
          }, 50);
        });
        newFill.addEventListener('touchstart', (ev) => {
          ev.stopPropagation();
          ev.preventDefault();
          overlay.classList.remove('show');
          menu.classList.remove('show');
          item.parentElement.classList.remove('pressing');
          if (state.mode === 'multi' || state.view === 'star') {
             toast('仅单式记录支持回填'); return;
          }
          setTimeout(() => {
            const activeItem = item._itemData;
            if (!activeItem) {
              toast('获取数据失败');
              return;
            }
            state.sel = JSON.parse(JSON.stringify(activeItem.numbers));
            state.locked = {};
            state.hasTriggerRandom = false;
            state.isLucky = activeItem.isLucky || false;
            render();
            toast('✅ 已回填至选号区');
          }, 50);
        });
        newCancel.addEventListener('touchstart', (ev) => {
          ev.stopPropagation();
          ev.preventDefault();
          overlay.classList.remove('show');
          menu.classList.remove('show');
          item.parentElement.classList.remove('pressing');
        });        
      }, 500);
    }
  },{passive:true});

  item.addEventListener('touchmove',e=>{
    const cx=e.touches[0].clientX; const cy=e.touches[0].clientY; const dx=cx-sx; const dy=cy-sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      clearTimeout(pressTimer);
      if(!item._isLongPressed) item.parentElement.classList.remove('pressing');
    }
    if(dir===null){ if(Math.abs(dx)>6||Math.abs(dy)>6){ dir=Math.abs(dx)>Math.abs(dy)?'h':'v'; } }
    if(dir==='v'){ return; }
    if(Math.abs(dx)>10) sw=true;
    let t = 0;
    if(item.classList.contains('swiped-left')){ t = -70 + dx; if(t>0) t=0; if(t<-70) t=-70; }
    else if(item.classList.contains('swiped-right')){ t = 70 + dx; if(t<0) t=0; if(t>70) t=70; }
    else{ t = dx; if(t>70) t=70; if(t<-70) t=-70; }
    item.style.transform='translateX('+t+'px)';
  },{passive:true});

  item.addEventListener('touchend',e=>{
    clearTimeout(pressTimer);
    if (!item._isLongPressed) {
      item.parentElement.classList.remove('pressing');
    }
    item.style.transition='transform .3s cubic-bezier(.25,.8,.25,1)';
    if (item._isLongPressed) {
      e.preventDefault();
      e.stopPropagation();
      return; 
    }
    if(dir==='v'){
      item.style.transform = item.classList.contains('swiped-left') ? 'translateX(-70px)' : (item.classList.contains('swiped-right') ? 'translateX(70px)' : '');
      dir=null; sw=false; return;
    }
    const dx = e.changedTouches[0].clientX - sx;
    if(sw){
      if(item.classList.contains('swiped-left')){
        if(dx > 30){ item.classList.remove('swiped-left'); item.style.transform=''; } else { item.style.transform='translateX(-70px)'; }
      }else if(item.classList.contains('swiped-right')){
        if(dx < -30){ item.classList.remove('swiped-right'); item.style.transform=''; } else { item.style.transform='translateX(70px)'; }
      }else{
        if(dx < -30){ item.classList.add('swiped-left'); item.style.transform='translateX(-70px)'; }
        else if(dx > 30){ item.classList.add('swiped-right'); item.style.transform='translateX(70px)'; }
        else { item.style.transform=''; }
      }
    }else{
      item.style.transform = item.classList.contains('swiped-left') ? 'translateX(-70px)' : (item.classList.contains('swiped-right') ? 'translateX(70px)' : '');
    }
    setTimeout(()=>{sw=false;},50);
  });

  item.addEventListener('click',e=>{ 
    if(sw || item._isLongPressed) {
      e.stopPropagation(); 
      e.preventDefault();
      item._isLongPressed = false;
    }
    else if(item.classList.contains('swiped-left') || item.classList.contains('swiped-right')){ 
      item.classList.remove('swiped-left','swiped-right'); 
      item.style.transform=''; 
    } 
  });
}

/* 👇 在这里插入画廊的 JS 逻辑 👇 */
// ================= 全屏画廊交互逻辑 =================
let titleSwipeTime = 0;
const titleEl = document.querySelector('.header h1');
// 👈 为了避免和长按菜单的 overlay 冲突，这里重命名为 galOverlay
const galOverlay = document.getElementById('gallery-overlay');
const galTrack = document.getElementById('gallery-track');

// 画廊图片版本：增/删图片时把数字+1，自动清除旧记忆索引【可选】
const GALLERY_IMG_VERSION = 2;
const localVer = parseInt(localStorage.getItem('galleryImgVer')||'0',10);
let galleryLastIndex;
if(localVer !== GALLERY_IMG_VERSION){
  localStorage.setItem('galleryImgVer',String(GALLERY_IMG_VERSION));
  localStorage.removeItem('galleryLastIndex');
  galleryLastIndex = 0;
}else{
  galleryLastIndex = parseInt(localStorage.getItem('galleryLastIndex') ?? '0',10) || 0;
}

// 1. 标题横向滑动防误触
let startX = 0, startY = 0;
titleEl.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, { passive: true });

titleEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;

  const isHorizontalSwipe = Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy);

  if(isHorizontalSwipe){
    const now = Date.now();
    if (now - titleSwipeTime < 1000) {
      // 第二次滑动：打开画廊，不震动
      titleSwipeTime = 0;
      openGallery();
    } else {
      // 第一次滑动：震动提示，记录时间戳
      playFeedback();
      titleSwipeTime = now;
    }
  }
});

// 2. 打开画廊
function openGallery() {
  // 👇 1. 先清动画（此时还没 .show，无动画可停），避免"跑几帧又被重置"的抖动
  galTrack.style.animation = 'none';
  void galTrack.offsetWidth;

  // 👇 2. 进入渲染树，起始 opacity = 0（.show 只负责 display，不再管 opacity）
  galOverlay.style.display = 'block';
  galOverlay.style.opacity = '0';
  galOverlay.classList.add('show');

  // 👇 3. 强制 reflow，让 opacity:0 成为"上一次计算值"
  void galOverlay.offsetWidth;

  // 👇 4. 下一帧把 opacity 推到 1，触发淡入
  requestAnimationFrame(() => {
    galOverlay.style.opacity = '1';
  });

  // 👇 5. 解除动画抑制，缩放回弹从 0% 干净开始
  galTrack.style.animation = '';

  // 👇 6. 定位到记忆的下标
  galTrack.style.scrollBehavior = 'auto';
  galTrack.scrollLeft = window.innerWidth * (1 + galleryLastIndex);

  setTimeout(() => {
    galTrack.style.scrollBehavior = 'smooth';
  }, 50);
}

// 3. 无限循环无缝跳跃
let isJumping = false; // 👈 新增防抖锁
galTrack.addEventListener('scroll', () => {
  if (!galOverlay.classList.contains('show') || isJumping) return;
  
  const width = window.innerWidth;
  const total = galTrack.children.length;

    // 监听用户是否滑动到了边界
  if (Math.round(galTrack.scrollLeft) <= 0) {
    isJumping = true;
    galTrack.style.scrollBehavior = 'auto'; // 瞬间关闭平滑
    galTrack.scrollLeft = width * (total - 2);
    requestAnimationFrame(() => {
      galTrack.style.scrollBehavior = 'smooth';
      isJumping = false;
    });
    return; // 👈 关键：跳跃帧直接结束，不往下算索引
  } else if (galTrack.scrollLeft + width >= width * total - 2) {
    isJumping = true;
    galTrack.style.scrollBehavior = 'auto';
    galTrack.scrollLeft = width;
    requestAnimationFrame(() => {
      galTrack.style.scrollBehavior = 'smooth';
      isJumping = false;
    });
    return; // 👈 关键：跳跃帧直接结束，不往下算索引
  }

  // 计算当前真实图片下标，持久化保存到localStorage
  let scrollX = Math.round(galTrack.scrollLeft);
  let realOffset = scrollX - width;
  let idx = Math.round(realOffset / width);
  const realTotal = total - 2;

  if(realTotal > 0){
    if(idx < 0 || idx >= realTotal){
      idx = 0;
    }
  }else{
    idx = 0;
  }

  if(galleryLastIndex !== idx){
    galleryLastIndex = idx;
    localStorage.setItem('galleryLastIndex', String(galleryLastIndex));
  }
}, { passive: true });

// 4. 下拉退出逻辑
let galleryStartY = 0, galleryStartX = 0, isDraggingDown = false, currentTranslateY = 0;

// 画廊拖拽状态重置（正常回弹 / 手势被打断都调用）
function galleryDragReset() {
  isDraggingDown = false;
  currentTranslateY = 0;
  galTrack.style.animation = 'none';            // 👈 停掉缩放动画
  galTrack.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
  galTrack.style.transform = 'translateY(0)';
  galOverlay.style.opacity = '1';
  setTimeout(() => {
    galTrack.style.transition = '';
    galTrack.style.animation = '';
  }, 300);
}

galTrack.addEventListener('touchstart', e => {
  galleryStartY = e.touches[0].clientY;
  galleryStartX = e.touches[0].clientX;
  isDraggingDown = false;
  currentTranslateY = 0;
  galTrack.style.transition = 'none';
}, { passive: true });

galTrack.addEventListener('touchmove', e => {
  if (!galOverlay.classList.contains('show')) return;
  const dy = e.touches[0].clientY - galleryStartY;
  const dx = e.touches[0].clientX - galleryStartX;

  // 如果水平移动大于垂直移动，说明是在左右切图，不拦截
  if (Math.abs(dx) > Math.abs(dy)) return;

  // 如果垂直下拉超过 10px
  if (dy > 10) {
    isDraggingDown = true;
    if (e.cancelable) e.preventDefault(); // 阻止原生的上下回弹
    
    currentTranslateY = dy;
    // 增加阻尼感，拉得越远越难拉
    const resistance = 0.8; 
    const moveY = dy * resistance;
    
    galTrack.style.transform = `translateY(${moveY}px)`;
    galOverlay.style.opacity = 1 - (moveY / 600); // 越拉越透明
  }
}, { passive: false });

galTrack.addEventListener('touchend', e => {
  if (isDraggingDown) {
        if (currentTranslateY > 150) {
      // 超过 150px 触发关闭
      galTrack.style.animation = 'none';        // 👈 关键：停掉缩放动画，避免和 transform 打架
      galTrack.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
      galTrack.style.transform = `translateY(100vh)`;
      galOverlay.style.opacity = '0';
            setTimeout(() => {
        galOverlay.style.display = 'none';
        galOverlay.style.opacity = '';          // 👈 清行内 opacity，保证下次打开从 0 淡入
        galTrack.style.transform = '';
        galTrack.style.transition = '';
        galTrack.style.animation = '';
        galOverlay.classList.remove('show');
      }, 300);

    } else {
      // 不够，回弹
      galleryDragReset();
    }
  }
});

// 手势被系统打断时重置拖拽状态
galTrack.addEventListener('touchcancel', () => {
  galleryDragReset();
}, { passive: true });

/* 👆 插入结束 👆 */
</script>
