name: Build Unsigned iOS
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install deps
        run: npm install --legacy-peer-deps
        
      - name: Add iOS and Sync
        run: |
          npx cap add ios
          npx cap sync ios
          
      - name: Generate App Icons
        run: |
          npx capacitor-assets generate --ios
          
      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
            
      - name: Package to IPA
        run: |
          cd $RUNNER_TEMP
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r App-unsigned.ipa Payload
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/App-unsigned.ipa
